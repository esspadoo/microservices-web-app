version: "3.9"

services:
  myapp:              
    build: 
      context: .
      dockerfile: ./owi/Dockerfile
    image: my_owilix
    volumes:
      - ./dataset:/app/dataset  # bind mount for your dataset
    working_dir: /app
    stdin_open: true            
    tty: true
    command: bash
    environment:
      OWILIX_AUTH_METHOD: device
      PY4LEXYS_AUTH_METHOD: device
      USE_DEVICE_FLOW: "true"
      OWILIX_DATA_DIR: /app/dataset

