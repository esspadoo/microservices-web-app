#-----------------------------------------------------
# INFERER — Topic Modeling Toolkit
#-----------------------------------------------------
  inferer:
    container_name: inferer
    image: inferer
    build:
      context: ./inferer
      dockerfile: Dockerfile
    ports:
      - "5050"
    networks:
      - internal


#-----------------------------------------------------
# MONGODB — Database that stores documents in BSON format
#-----------------------------------------------------
  mongodb:
    image: mongo:8.2.2-noble
    container_name: mongodb
    networks:
      - internal
    volumes:
      - mongodb-volume:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })'" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always


#-----------------------------------------------------
# ELASTICSEARCH — Single-node Elasticsearch's instance with disabled security features and persistent storage for indexed data.
#-----------------------------------------------------
  elasticsearch:
    container_name: elasticsearch
    image: elastic/elasticsearch:9.1.8
    ports:
      - "9200"
    networks: 
      - internal
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 50s
    volumes:
      - elasticsearch-volume:/usr/share/elasticsearch/data


#-----------------------------------------------------
# SEARCHER — Spring's project app (REST).
#-----------------------------------------------------
  searcher:
    container_name: searcher
    image: searcher
    build:
      context: ./searcher
      dockerfile: Dockerfile
    ports:
      - "8881"
    environment:
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/documents
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - internal


#-----------------------------------------------------
# IMPORTER — Spring's project app (REST).
#-----------------------------------------------------
  importer:
    container_name: importer
    image: importer
    build:
      context: ./importer
      dockerfile: Dockerfile
    ports:
      - "8882"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - internal

 
#-----------------------------------------------------
# NGINX — Reverse proxy for UI.
#-----------------------------------------------------  
 
  nginx:
    container_name: proxy-nginx
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/static:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8080:80
    depends_on:
      - searcher
    networks:
      - public
      - internal

#-----------------------------------------------------
# SWAGGER-UI — Responsible for API docs
#-----------------------------------------------------
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-docs
    ports:
      - 8081:8080
    environment:
      #BASE_URL: /docs
      URLS: "[ 
          { url: '/docs/api-docs/searcher', name: 'Searcher API' },
          { url: '/docs/api-docs/importer', name: 'Importer API' },
          { url: '/docs/api-docs/inferer', name: 'Inferer API' }  
        ]" 
    networks:
      - public
      #- internal


volumes:
  mongodb-volume:
  elasticsearch-volume:

networks:
  public:
    driver: bridge

  internal:
    driver: bridge
    internal: true

