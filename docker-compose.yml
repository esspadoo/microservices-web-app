services:

#-----------------------------------------------------
# OWILIX — Container used to download and filter OWI-related datasets
#-----------------------------------------------------
  owilix:
    build: 
      context: ./owi
      dockerfile: Dockerfile
    image: owilix
    volumes:
      - ./all_data/raw_data:/app/all_data/.owi
      - ./all_data:/app/all_data
    working_dir: /app
    environment:
      HOME: /app/all_data
      OWI_PATH: /app/all_data/
      OWI_AUTH_METHOD: device
      PY4LEXYS_AUTH_METHOD: device
      USE_DEVICE_FLOW: "true"
    networks:
      - softPlat-network
    restart: no


#-----------------------------------------------------
# MALLET — Topic Modeling Toolkit
#-----------------------------------------------------
  mallet:
    build:
      context: ./mallet
      dockerfile: Dockerfile
    image: mallet_jdk
    container_name: mallet
    networks:
      - softPlat-network
    volumes:
      - ./mallet_data:/data
      - ./all_data:/all_data
    working_dir: /opt/mallet
    restart: no


#-----------------------------------------------------
# MONGODB — Database that stores documents in BSON format
#-----------------------------------------------------
  mongodb:
    image: mongo:8.2.2-noble
    container_name: mongodb
    networks:
      - softPlat-network
    ports:
      - 27017:27017
    volumes:
      - mongodb-volume:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })'" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always


  #-----------------------------------------------------
  # ELASTICSEARCH — Single-node Elasticsearch's instance with disabled security features and persistent storage for indexed data.
  #-----------------------------------------------------
  elasticsearch:
    container_name: elasticsearch
    image: elastic/elasticsearch:9.1.8
    ports:
      - 9200:9200
    networks:
      - softPlat-network
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health" ]
      interval: 30s
      timeout: 30s
      retries: 3
    volumes:
      - elasticsearch-volume:/usr/share/elasticsearch/data

#-----------------------------------------------------
# LOGSTASH — Logstash's instance with custom configuration files, enabling ingestion and processing pipelines for Elasticsearch.
#-----------------------------------------------------
  logstash:
    image: elastic/logstash:9.1.8
    container_name: logstash
    command: -f /etc/logstash/conf.d/
    volumes:
      - ./logstash/:/etc/logstash/conf.d/
    ports:
      - 9999:9999
    networks:
      - softPlat-network
    environment:
      - xpack.monitoring.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy

#-----------------------------------------------------
# NGINX — Reverse proxy for UI.
#-----------------------------------------------------
  #proxy:
  nginx:
    container_name: proxy-nginx
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/static:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 4321:80
    networks:
      - softPlat-network


volumes:
  mongodb-volume:
  elasticsearch-volume:

networks:
  softPlat-network: