services:

#-----------------------------------------------------
# OWILIX — Container used to download and filter OWI-related datasets
#-----------------------------------------------------
  owilix:
    build: 
      context: ./owi
      dockerfile: Dockerfile
    container_name: owilix
    image: owilix
    volumes:
      - ./all_data/raw_data:/app/all_data/.owi
      - ./all_data:/app/all_data
    working_dir: /app
    environment:
      HOME: /app/all_data
      OWI_PATH: /app/all_data/
      OWI_AUTH_METHOD: device
      PY4LEXYS_AUTH_METHOD: device
      USE_DEVICE_FLOW: "true"
    networks:
      - softPlat-network
    restart: no


#-----------------------------------------------------
# MALLET — Topic Modeling Toolkit
#-----------------------------------------------------
  mallet:
    build:
      context: ./mallet
      dockerfile: Dockerfile
    image: mallet_jdk
    container_name: mallet
    networks:
      - softPlat-network
    volumes:
      - ./mallet_data:/data
      - ./all_data:/all_data  
    working_dir: /opt/mallet
    restart: no


#-----------------------------------------------------
# ELASTICSEARCH — Single-node Elasticsearch's instance with disabled security features and persistent storage for indexed data.
#-----------------------------------------------------
  elasticsearch:
    container_name: elasticsearch
    image: elastic/elasticsearch:9.1.8
    ports:
      - 9200:9200
    networks: 
      - softPlat-network
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - elasticsearch-volume:/usr/share/elasticsearch/data


#-----------------------------------------------------
# SEARCHER — Spring's project app (REST).
#-----------------------------------------------------
  searcher:
    container_name: searcher
    image: searcher
    build:
      context: ./search-application
      dockerfile: Dockerfile
    ports:
      - 8881:8881
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - softPlat-network

 
#-----------------------------------------------------
# NGINX — Reverse proxy for UI.
#-----------------------------------------------------  
 
  nginx:
    container_name: proxy-nginx
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/static:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8080:80
    depends_on:
      - searcher
    networks:
      - softPlat-network
      

volumes:
  elasticsearch-volume:

networks:
  softPlat-network: