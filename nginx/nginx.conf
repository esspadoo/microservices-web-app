server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://searcher:8881;
    }

    location /api/v1/importer/import {
        proxy_pass http://importer:8882;

        limit_except POST {
            deny all;
        }
    }

    location /api/v1/importer/hello {
        proxy_pass http://importer:8882;
    }

    location /api/v1/searcher/search {
        proxy_pass http://searcher:8881;
    }
}

